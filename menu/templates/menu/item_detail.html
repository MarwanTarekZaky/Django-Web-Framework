{% extends "base.html" %}

{% block title %}{{ item.name }} | The Little Bistro{% endblock %}

{% block content %}
    <h1>{{ item.name }}</h1>
    <p class="price">${{ item.price }}</p>
    <p>{{ item.description|default:"No description yet." }}</p>
    <p><small>Added on {{ item.created_at|date:"F j, Y" }}</small></p>

    <a href="{% url 'menu:home' %}">&larr; Back to the menu</a>
{% endblock %}
